{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="panel p-4">
      <h1 class="h3 mb-3">Edit profile</h1>
      <form method="post" class="needs-validation" novalidate>
        {{ csrf() }}
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="full_name">Full name</label>
            <input class="form-control" id="full_name" name="full_name" value="{{ form.full_name }}" required minlength="2" maxlength="100">
            <div class="invalid-feedback">Enter your full name.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="roll_number">Roll number</label>
            <input class="form-control" id="roll_number" name="roll_number" value="{{ form.roll_number }}" required minlength="3" maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9/_\-]{2,29}">
            <div class="invalid-feedback">Use 3 to 30 letters, numbers, / _ or -.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="year_of_study">Year of study</label>
            <select class="form-select" id="year_of_study" name="year_of_study" required>
              {% for y in range(1, 6) %}<option value="{{ y }}" {{ 'selected' if form.year_of_study|string == y|string }}>Year {{ y }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="department">Department</label>
            <select class="form-select" id="department" name="department" required>
              {% for d in departments %}<option {{ 'selected' if form.department == d }}>{{ d }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="bio">Short bio (optional)</label>
            <textarea class="form-control" id="bio" name="bio" rows="3" maxlength="255" data-counter>{{ form.bio }}</textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-primary" type="submit">Save changes</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('profile') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
